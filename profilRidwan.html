<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil [Nama]</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="profile">
            <div class="photo">
                <img src="images/[nama-foto].jpg" alt="Foto [Nama]">
            </div>

            <h1>[Nama Lengkap]</h1>
            <p class="prodi">Sistem Informasi</p>
        </div>

        <div class="content">

            <h2>Tentang Saya</h2>
            <p>
                [Tuliskan deskripsi singkat tentang diri kamu,
                minat, atau hal yang ingin kamu pelajari.]
            </p>

            <h2>Data Diri</h2>

            <div class="data">
                <p><b>NIM</b> [NIM]</p>
                <p><b>Program Studi</b> Sistem Informasi</p>
                <p><b>Universitas</b> Universitas Pembangunan Jaya</p>
            </div>

            <h2>Minat</h2>

            <div class="minat">
                <span>[Minat 1]</span>
                <span>[Minat 2]</span>
                <span>[Minat 3]</span>
            </div>

        </div>

    </div>

</body>
</html>
